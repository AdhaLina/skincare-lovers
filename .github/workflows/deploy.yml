# Deploys the static site to GitHub Pages on every push.
#
# One-time setup: in your repo, go to Settings → Pages → "Build and
# deployment" → Source: "GitHub Actions". Then push and this workflow
# publishes the site automatically — free, with no credit limits.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/skincare-affiliate-site-4yjwar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
